######################################################################
# Production Profile — all credentials sourced from environment variables.
# Never commit real values here; use ${ENV_VAR} placeholders exclusively.
######################################################################

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/oa_system?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

jwt:
  # No default in production — the app will fail to start if JWT_SECRET is missing.
  secret: ${JWT_SECRET}

oa:
  upload:
    path: ${UPLOAD_PATH:/data/uploads}

logging:
  level:
    cn.oa.mapper: warn
