server:
  port: 8080

spring:
  profiles:
    active: local
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: "1"
      logic-not-delete-value: "0"

springdoc:
  swagger-ui:
    path: /doc.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /api/**

oa:
  upload:
    path: uploads

jwt:
  # IMPORTANT: JWT_SECRET must be set via environment variable in production!
  # Example: export JWT_SECRET=your-strong-random-secret-at-least-32-chars
  secret: "${JWT_SECRET:oa-system-jwt-secret-key-default}"

logging:
  level:
    cn.oa.mapper: debug
