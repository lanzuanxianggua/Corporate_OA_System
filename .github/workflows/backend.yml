name: CI - Backend Build & Test

on:
  push:
    branches: [master]
    paths:
      - 'code/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [master]
    paths:
      - 'code/backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: code/backend
        run: mvn clean package -Dmaven.test.skip=true -B -V

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: oa-web-jar
          path: code/backend/oa-web/target/oa-web-1.0.0.jar
          retention-days: 5
