name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target environment"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - staging
          - prod
      tag:
        description: "Docker image tag (default: git sha)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build JAR
        working-directory: code/backend
        run: mvn clean package -Dmaven.test.skip=true -B -V

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: code/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.environment }}

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets[format('DEPLOY_HOST_{0}', inputs.environment)] }}
          port: ${{ secrets[format('DEPLOY_PORT_{0}', inputs.environment)] || 22 }}
          username: ${{ secrets[format('DEPLOY_USER_{0}', inputs.environment)] }}
          key: ${{ secrets[format('DEPLOY_KEY_{0}', inputs.environment)] }}
          script: |
            set -e
            cd ${{ secrets[format('DEPLOY_PATH_{0}', inputs.environment)] }}

            echo "Pulling image..."
            docker compose pull backend

            echo "Recreating backend service..."
            docker compose up -d --force-recreate backend

            echo "Waiting for health check..."
            for i in $(seq 1 12); do
              sleep 10
              if curl -sf http://localhost:8080/actuator/health; then
                echo "Health check passed."
                exit 0
              fi
              echo "Attempt $i/12 — not healthy yet."
            done
            echo "Health check failed after 120s."
            exit 1
