name: API Test

on:
  push:
    branches: [master]
    paths:
      - 'code/backend/**'
      - 'tests/api-test.sh'
      - '.github/workflows/api-test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'code/backend/**'

jobs:
  api-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: oa_system_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install redis-cli
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools

      - name: Initialize database
        run: |
          # Base tables (12 core tables + seed data for dept/employee/role)
          sed 's/oa_system/oa_system_test/g; s/CREATE DATABASE[^;]*;//g' \
            code/backend/oa-web/src/main/resources/sql/init.sql | \
            mysql --force -h 127.0.0.1 -u root -ptest_password oa_system_test 2>&1
          # All remaining tables + ALTER columns for base tables
          sed 's/oa_system/oa_system_test/g; s/CREATE DATABASE[^;]*;//g' \
            code/backend/sql/phase_all_ddl.sql | \
            mysql --force -h 127.0.0.1 -u root -ptest_password oa_system_test 2>&1 || true
          # Workflow migration: wf_cc_record, wf_delegation, task ALTERs
          sed 's/oa_system/oa_system_test/g' \
            code/backend/workflow_migration.sql | \
            mysql --force -h 127.0.0.1 -u root -ptest_password oa_system_test 2>&1 || true
          # Add missing columns that entities expect but init.sql didn't define
          mysql --force -h 127.0.0.1 -u root -ptest_password oa_system_test -e "
            ALTER TABLE sys_role ADD COLUMN remark VARCHAR(500) DEFAULT '' COMMENT '备注';
            ALTER TABLE sys_role ADD COLUMN del_flag CHAR(1) DEFAULT '0' COMMENT '删除标志';
            ALTER TABLE sys_role ADD COLUMN update_time DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间';
            ALTER TABLE sys_emp_role ADD COLUMN del_flag CHAR(1) DEFAULT '0' COMMENT '删除标志';
            ALTER TABLE oa_attendance ADD COLUMN ip VARCHAR(50) DEFAULT '' COMMENT 'IP地址';
            ALTER TABLE oa_attendance ADD COLUMN address VARCHAR(200) DEFAULT '' COMMENT '地址';
            ALTER TABLE oa_leave_apply ADD COLUMN leave_period VARCHAR(20) DEFAULT 'full' COMMENT '请假时段';
          " 2>/dev/null || true
          # Seed: extra employees (wujiu etc.) + attendance history
          sed 's/oa_system/oa_system_test/g' \
            code/backend/init_dashboard_data.sql | \
            mysql --force -h 127.0.0.1 -u root -ptest_password oa_system_test 2>&1 || true
          # Seed: dict types/data
          sed 's/oa_system/oa_system_test/g' \
            code/backend/sql/test_data.sql | \
            mysql --force -h 127.0.0.1 -u root -ptest_password oa_system_test 2>&1 || true
          # Seed: workflow roles
          sed 's/oa_system/oa_system_test/g' \
            code/backend/sql/seed_workflow_roles.sql | \
            mysql --force -h 127.0.0.1 -u root -ptest_password oa_system_test 2>&1 || true
          # Seed: workflow definitions (leave/trip/outing/purchase/expense) + meeting rooms
          sed 's/oa_system/oa_system_test/g' \
            code/backend/init_workflow_meeting.sql | \
            mysql --force -h 127.0.0.1 -u root -ptest_password oa_system_test 2>&1 || true
          # Add missing overtime and loan workflow definitions
          mysql --force -h 127.0.0.1 -u root -ptest_password oa_system_test -e "
            INSERT IGNORE INTO wf_process_definition (id, process_type, process_name, node_config, version, status)
            VALUES (100, 'overtime', '加班申请', '[{\"nodeIndex\":1,\"nodeName\":\"部门主管审批\",\"nodeType\":\"approval\",\"assigneeType\":\"dept_manager\"}]', 1, '0');
            INSERT IGNORE INTO wf_process_definition (id, process_type, process_name, node_config, version, status)
            VALUES (101, 'loan', '借支申请', '[{\"nodeIndex\":1,\"nodeName\":\"部门主管审批\",\"nodeType\":\"approval\",\"assigneeType\":\"dept_manager\"}]', 1, '0');
          " 2>&1 || true

      - name: Verify database tables
        run: |
          echo "=== Tables in oa_system_test ==="
          mysql -h 127.0.0.1 -u root -ptest_password oa_system_test -e "SHOW TABLES;"
          echo "=== sys_employee count ==="
          mysql -h 127.0.0.1 -u root -ptest_password oa_system_test -e "SELECT COUNT(*) as cnt FROM sys_employee;"
          echo "=== sys_employee columns ==="
          mysql -h 127.0.0.1 -u root -ptest_password oa_system_test -e "DESCRIBE sys_employee;"

      - name: Build backend
        working-directory: code/backend
        run: mvn clean package -Dmaven.test.skip=true -B -q

      - name: Start backend
        working-directory: code/backend
        run: |
          java -jar oa-web/target/oa-web-1.0.0.jar \
            --spring.profiles.active= \
            --spring.datasource.url=jdbc:mysql://127.0.0.1:3306/oa_system_test?useSSL=false\&serverTimezone=Asia/Shanghai\&allowPublicKeyRetrieval=true \
            --spring.datasource.username=root \
            --spring.datasource.password=test_password \
            --spring.data.redis.host=127.0.0.1 > /tmp/backend.log 2>&1 &
          echo "Waiting for backend to start..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:8080/api/auth/captcha > /dev/null 2>&1; then
              echo "Backend started successfully"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done

      - name: Debug login
        run: |
          echo "=== Test captcha ==="
          CR=$(curl -s http://localhost:8080/api/auth/captcha)
          echo "$CR" | head -c 150
          echo ""
          UUID=$(echo "$CR" | grep -o '"uuid":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "UUID=$UUID"
          CAP_RAW=$(redis-cli GET "captcha:$UUID")
          echo "Captcha raw=$CAP_RAW"
          CAP=$(echo "$CAP_RAW" | tr -d '"' | tr -d '\r\n')
          echo "Captcha clean=$CAP"
          echo "=== Test login admin ==="
          LR=$(curl -s -X POST http://localhost:8080/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"admin\",\"password\":\"123456\",\"captchaCode\":\"$CAP\",\"captchaUuid\":\"$UUID\"}")
          echo "Login response: $LR"
          echo "=== Backend tail log ==="
          tail -30 /tmp/backend.log 2>/dev/null || echo "No log file"

      - name: Run API tests
        run: bash tests/api-test.sh
        env:
          REDIS_CLI: redis-cli

      - name: Print backend logs on failure
        if: failure()
        run: |
          echo "=== Backend logs (last 100 lines) ==="
          tail -100 /tmp/backend.log 2>/dev/null || echo "No log file"
