name: API Test

on:
  push:
    branches: [master]
    paths:
      - 'code/backend/**'
      - 'tests/api-test.sh'
      - '.github/workflows/api-test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'code/backend/**'

jobs:
  api-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: oa_system_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Initialize database
        run: |
          mysql -h 127.0.0.1 -u root -ptest_password oa_system_test < code/backend/sql/init.sql 2>/dev/null || true
        continue-on-error: true

      - name: Build backend
        working-directory: code/backend
        run: mvn clean package -Dmaven.test.skip=true -B -q

      - name: Start backend
        working-directory: code/backend
        run: |
          java -jar oa-web/target/oa-web-1.0.0.jar \
            --spring.datasource.url=jdbc:mysql://127.0.0.1:3306/oa_system_test?useSSL=false\&serverTimezone=Asia/Shanghai\&allowPublicKeyRetrieval=true \
            --spring.datasource.password=test_password \
            --spring.data.redis.host=127.0.0.1 &
          echo "Waiting for backend to start..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:8080/api/auth/captcha > /dev/null 2>&1; then
              echo "Backend started successfully"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done

      - name: Run API tests
        run: bash tests/api-test.sh
        env:
          REDIS_CLI: redis-cli
