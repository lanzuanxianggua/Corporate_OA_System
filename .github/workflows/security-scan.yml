name: "Security Scan"

on:
  schedule:
    - cron: '0 2 * * 1'
  push:
    branches: [master]
    paths:
      - 'code/backend/**'
  pull_request:
    branches: [master]
    paths:
      - 'code/backend/**'

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin, javascript-typescript
          queries: security-and-quality

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build code
        working-directory: code/backend
        run: mvn clean compile -B -q -Dmaven.test.skip=true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        id: codeql-analyze
        with:
          category: "/language:java-kotlin"
        continue-on-error: true

      - name: Check CodeQL result
        if: steps.codeql-analyze.outcome == 'failure'
        run: |
          echo "::warning::CodeQL analysis failed. This may be due to Default Setup being enabled in repo settings."
          echo "If so, disable Default Setup at: Settings → Code security → Code scanning → Default setup"
