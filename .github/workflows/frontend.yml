name: "CI - Frontend & Mobile"

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "code/frontend/**"
      - "code/mobile/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [master]
    paths:
      - "code/frontend/**"
      - "code/mobile/**"

jobs:
  frontend-build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-frontend-${{ hashFiles('code/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-frontend-

      - name: Install dependencies
        working-directory: code/frontend
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: TypeScript type check
        working-directory: code/frontend
        run: pnpm typecheck || echo "Type check warnings found (non-blocking)"

      - name: Build
        working-directory: code/frontend
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: code/frontend/dist/
          retention-days: 5

  mobile-build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-mobile-${{ hashFiles('code/mobile/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-mobile-

      - name: Install dependencies
        working-directory: code/mobile
        run: pnpm install

      - name: Build H5
        working-directory: code/mobile
        run: pnpm build:h5

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-h5-dist
          path: code/mobile/dist/build/h5/
          retention-days: 5
