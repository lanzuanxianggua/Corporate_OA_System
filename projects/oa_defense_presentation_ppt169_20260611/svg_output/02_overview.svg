<svg viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="80" fill="url(#headerGradient)"/>
  <text x="60" y="50" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
        font-size="36" font-weight="700" fill="#FFFFFF">
    项目概述
  </text>

  <!-- Content area -->
  <g id="content">
    <!-- Left column: 系统定位 -->
    <g id="left-column">
      <rect x="60" y="120" width="520" height="520" fill="#F5F7FA" rx="12"/>

      <text x="90" y="170" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="27" font-weight="600" fill="#1565C0">
        系统定位
      </text>

      <text x="90" y="220" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="18" fill="#1D1D1F">
        <tspan x="90" dy="0">面向 200-5000 人企业的</tspan>
        <tspan x="90" dy="29">办公自动化系统</tspan>
      </text>

      <text x="90" y="300" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="18" fill="#1D1D1F">
        <tspan x="90" dy="0">覆盖 8 大业务域：</tspan>
        <tspan x="90" dy="29">行政、人事、财务、审批、</tspan>
        <tspan x="90" dy="29">协同、资产、知识、报表</tspan>
      </text>

      <text x="90" y="410" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="18" fill="#1D1D1F">
        <tspan x="90" dy="0">核心价值：</tspan>
        <tspan x="90" dy="29">减少线下审批和人工统计成本，</tspan>
        <tspan x="90" dy="29">实现办公流程线上化</tspan>
      </text>
    </g>

    <!-- Right column: 核心目标 -->
    <g id="right-column">
      <rect x="620" y="120" width="600" height="520" fill="#F5F7FA" rx="12"/>

      <text x="650" y="170" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="27" font-weight="600" fill="#1565C0">
        核心目标
      </text>

      <!-- Goal 1 -->
      <circle cx="670" cy="230" r="8" fill="#4CAF50"/>
      <text x="700" y="237" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="18" fill="#1D1D1F">
        业务模块清晰，职责分明
      </text>

      <!-- Goal 2 -->
      <circle cx="670" cy="290" r="8" fill="#4CAF50"/>
      <text x="700" y="297" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="18" fill="#1D1D1F">
        <tspan x="700" dy="0">审批流程可配置，</tspan>
        <tspan x="700" dy="29">灵活适配企业需求</tspan>
      </text>

      <!-- Goal 3 -->
      <circle cx="670" cy="360" r="8" fill="#4CAF50"/>
      <text x="700" y="367" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="18" fill="#1D1D1F">
        权限可控、数据可追溯
      </text>

      <!-- Goal 4 -->
      <circle cx="670" cy="420" r="8" fill="#4CAF50"/>
      <text x="700" y="427" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="18" fill="#1D1D1F">
        <tspan x="700" dy="0">接口统一、</tspan>
        <tspan x="700" dy="29">前端页面可快速扩展</tspan>
      </text>
    </g>
  </g>

  <!-- Footer -->
  <text x="1220" y="705" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
        font-size="12" fill="#ADB5BD" text-anchor="end">
    2
  </text>
</svg>
