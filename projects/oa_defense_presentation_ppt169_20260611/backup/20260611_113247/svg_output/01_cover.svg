<svg viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="50%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%">
      <stop offset="0%" stop-color="#4CAF50" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4CAF50" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#coverBg)"/>
  <rect width="1280" height="720" fill="url(#glow1)"/>
  <rect width="1280" height="720" fill="url(#glow2)"/>

  <!-- 装饰性几何元素 -->
  <g opacity="0.1">
    <circle cx="150" cy="150" r="80" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="150" cy="150" r="100" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <rect x="1050" y="500" width="150" height="150" fill="none" stroke="#FFFFFF" stroke-width="2" rx="20"/>
    <line x1="200" y1="600" x2="350" y2="650" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="350" cy="650" r="8" fill="#4CAF50"/>
  </g>

  <!-- 主标题区域 -->
  <g id="title-group">
    <text x="640" y="260" font-family="Microsoft YaHei, PingFang SC, sans-serif"
          font-size="76" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      企业 OA 办公自动化系统
    </text>

    <!-- 标题下划线装饰 -->
    <rect x="440" y="280" width="400" height="4" fill="#4CAF50" rx="2"/>

    <text x="640" y="340" font-family="Microsoft YaHei, PingFang SC, sans-serif"
          font-size="28" font-weight="400" fill="#E3F2FD" text-anchor="middle" opacity="0.95">
      基于 Spring Boot 3 + Vue 3 的企业级办公管理平台
    </text>
  </g>

  <!-- 信息卡片 -->
  <g id="info-card">
    <rect x="390" y="420" width="500" height="200" fill="#FFFFFF" fill-opacity="0.12" rx="16"/>
    <rect x="390" y="420" width="500" height="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" rx="16"/>

    <g opacity="0.9">
      <text x="640" y="475" font-family="Microsoft YaHei, PingFang SC, sans-serif"
            font-size="20" fill="#E3F2FD" text-anchor="middle">
        答辩人：[姓名]
      </text>
      <line x1="490" y1="495" x2="790" y2="495" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>

      <text x="640" y="530" font-family="Microsoft YaHei, PingFang SC, sans-serif"
            font-size="20" fill="#E3F2FD" text-anchor="middle">
        指导老师：[教师姓名]
      </text>
      <line x1="490" y1="550" x2="790" y2="550" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>

      <text x="640" y="585" font-family="Microsoft YaHei, PingFang SC, sans-serif"
            font-size="20" fill="#E3F2FD" text-anchor="middle">
        答辩日期：2026 年 6 月
      </text>
    </g>
  </g>

  <!-- 底部标签 -->
  <g id="tech-tags" opacity="0.7">
    <rect x="80" y="660" width="120" height="36" fill="#4CAF50" rx="18"/>
    <text x="140" y="683" font-family="Microsoft YaHei, PingFang SC, sans-serif"
          font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">
      Spring Boot
    </text>

    <rect x="220" y="660" width="80" height="36" fill="#FF6B35" rx="18"/>
    <text x="260" y="683" font-family="Microsoft YaHei, PingFang SC, sans-serif"
          font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">
      Vue 3
    </text>

    <rect x="320" y="660" width="100" height="36" fill="#1565C0" rx="18"/>
    <text x="370" y="683" font-family="Microsoft YaHei, PingFang SC, sans-serif"
          font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">
      MySQL
    </text>
  </g>
</svg>
