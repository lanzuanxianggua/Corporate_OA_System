<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D47A1" />
      <stop offset="50%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#1976D2" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%">
      <stop offset="0%" stop-color="#4CAF50" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4CAF50" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#coverBg)" />
  <rect width="1280" height="720" fill="url(#glow1)" />
  <rect width="1280" height="720" fill="url(#glow2)" />

  
  <g opacity="0.1">
    <circle cx="150" cy="150" r="80" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="150" cy="150" r="100" fill="none" stroke="#FFFFFF" stroke-width="1" />
    <path fill="none" stroke="#FFFFFF" stroke-width="2" d="M1070,500 H1180 A20,20 0 0 1 1200,520 V630 A20,20 0 0 1 1180,650 H1070 A20,20 0 0 1 1050,630 V520 A20,20 0 0 1 1070,500 Z" />
    <line x1="200" y1="600" x2="350" y2="650" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="350" cy="650" r="8" fill="#4CAF50" />
  </g>

  
  <g id="title-group">
    <text x="640" y="260" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="76" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      企业 OA 办公自动化系统
    </text>

    
    <path fill="#4CAF50" d="M442,280 H838 A2,2 0 0 1 840,282 V282 A2,2 0 0 1 838,284 H442 A2,2 0 0 1 440,282 V282 A2,2 0 0 1 442,280 Z" />

    <text x="640" y="340" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#E3F2FD" text-anchor="middle" opacity="0.95">
      基于 Spring Boot 3 + Vue 3 的企业级办公管理平台
    </text>
  </g>

  
  <g id="info-card">
    <path fill="#FFFFFF" fill-opacity="0.12" d="M406,420 H874 A16,16 0 0 1 890,436 V604 A16,16 0 0 1 874,620 H406 A16,16 0 0 1 390,604 V436 A16,16 0 0 1 406,420 Z" />
    <path fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" d="M406,420 H874 A16,16 0 0 1 890,436 V604 A16,16 0 0 1 874,620 H406 A16,16 0 0 1 390,604 V436 A16,16 0 0 1 406,420 Z" />

    <g opacity="0.9">
      <text x="640" y="475" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#E3F2FD" text-anchor="middle">
        答辩人：[姓名]
      </text>
      <line x1="490" y1="495" x2="790" y2="495" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

      <text x="640" y="530" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#E3F2FD" text-anchor="middle">
        指导老师：[教师姓名]
      </text>
      <line x1="490" y1="550" x2="790" y2="550" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

      <text x="640" y="585" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#E3F2FD" text-anchor="middle">
        答辩日期：2026 年 6 月
      </text>
    </g>
  </g>

  
  <g id="tech-tags" opacity="0.7">
    <path fill="#4CAF50" d="M98,660 H182 A18,18 0 0 1 200,678 V678 A18,18 0 0 1 182,696 H98 A18,18 0 0 1 80,678 V678 A18,18 0 0 1 98,660 Z" />
    <text x="140" y="683" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">
      Spring Boot
    </text>

    <path fill="#FF6B35" d="M238,660 H282 A18,18 0 0 1 300,678 V678 A18,18 0 0 1 282,696 H238 A18,18 0 0 1 220,678 V678 A18,18 0 0 1 238,660 Z" />
    <text x="260" y="683" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">
      Vue 3
    </text>

    <path fill="#1565C0" d="M338,660 H402 A18,18 0 0 1 420,678 V678 A18,18 0 0 1 402,696 H338 A18,18 0 0 1 320,678 V678 A18,18 0 0 1 338,660 Z" />
    <text x="370" y="683" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">
      MySQL
    </text>
